[package]
name = "claviron-java-application-check"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
claviron = { version = "0.2.0-alpha.25", default-features = false, features = ["orbit", "application"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "io-std", "sync"] }
tokio-util = { version = "0.7", features = ["rt"] }

[lints]
workspace = true
